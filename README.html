<style>
/* Layout: tall schematic map of the land on one side, a reading panel on the other; chips under the map select tribes. */
:root{
  --bg:#e8edef; --surface:#f6f8f9; --ink:#17252d; --muted:#53666f; --line:#c8d4d9; --sea:#d2e3eb; --river:#7fb0c8;
  --accent:#1f5f7b; --win:#1b7748; --loss:#b0372b; --mix:#9a6609; --int:#6a4ea6; --abs:#667880;
  --ts:40%; --tl:76%; --te:48%;
  --font-d:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --font-b:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e171c; --surface:#16222a; --ink:#e5eef2; --muted:#93a7b0; --line:#2a3b44; --sea:#122028; --river:#3e7a96;
  --accent:#74bad8; --win:#5fd09a; --loss:#ff8d80; --mix:#f1bb5c; --int:#b9a0f4; --abs:#9aaab2;
  --ts:34%; --tl:30%; --te:56%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e171c; --surface:#16222a; --ink:#e5eef2; --muted:#93a7b0; --line:#2a3b44; --sea:#122028; --river:#3e7a96;
  --accent:#74bad8; --win:#5fd09a; --loss:#ff8d80; --mix:#f1bb5c; --int:#b9a0f4; --abs:#9aaab2;
  --ts:34%; --tl:30%; --te:56%; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.6;
  padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--font-d);font-weight:700;font-size:clamp(26px,4vw,36px);line-height:1.2;margin:0;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted);max-width:60ch}
.grid{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.mapcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:10px}
svg{display:block;width:100%;height:auto;max-height:78vh;border-radius:8px;background:var(--sea)}
.tribe{fill:hsl(var(--h) var(--ts) var(--tl));stroke:hsl(var(--h) 30% var(--te));stroke-width:1.5;stroke-linejoin:round;cursor:pointer;transition:opacity .3s,filter .2s}
.tribe:hover{filter:brightness(1.08)}
.tribe:focus-visible{outline:none;stroke:var(--ink);stroke-width:3}
.has-sel .tribe{opacity:.38}
.has-sel .tribe.sel{opacity:1;stroke:var(--ink);stroke-width:3}
.tl{font-family:var(--font-b);font-size:13px;font-weight:600;fill:var(--ink);text-anchor:middle;pointer-events:none;opacity:.8}
.sea-l{font-size:14px;fill:var(--muted);text-anchor:middle;font-style:italic}
.river{fill:none;stroke:var(--river);stroke-width:5;stroke-linecap:round}
.lake{fill:var(--river)}
.city{cursor:pointer;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d);transform-box:fill-box;transform-origin:center}
.city circle{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.city text{font-size:12px;font-weight:600;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--surface);stroke-width:3.5;stroke-linejoin:round}
.city.on circle{fill:var(--accent);r:8}
.city.on text{font-size:13.5px}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.node circle.base{stroke:var(--surface);stroke-width:2.5}
.node.enemy circle.base{fill:var(--ink)}
.node text{font-size:12.5px;font-weight:600;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--surface);stroke-width:4;stroke-linejoin:round}
.node.in{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:center}
.ring{fill:none;stroke-width:4}
.arrow{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0}
.arrow.new{stroke-dashoffset:1;animation:draw 1.1s .1s forwards}
.head{fill:var(--ink)}
.head.new{opacity:0;animation:fade .2s 1.1s forwards}
.unit{fill:var(--accent)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
.clash line{stroke:var(--loss);stroke-width:5;stroke-linecap:round}
.burst{fill:none;stroke:var(--loss);stroke-width:3;transform-box:fill-box;transform-origin:center}
.clash.new .burst{animation:burst 1s ease-out 2}
.clash.new{animation:fade .01s both}
@keyframes burst{from{transform:scale(.4);opacity:1}to{transform:scale(2.6);opacity:0}}
.res.new{animation:pop .5s .1s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 12px 4px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:34px}
.chip i{width:11px;height:11px;border-radius:50%;background:hsl(var(--h) 45% 55%);display:inline-block}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,.tab:focus-visible,.btn:focus-visible,.cbtn:focus-visible,.wcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{font-size:12.5px;color:var(--muted);margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.phead{display:flex;flex-direction:column;gap:2px;border-inline-start:6px solid hsl(var(--h) 45% 55%);padding-inline-start:12px}
.phead h2{font-family:var(--font-d);font-size:26px;line-height:1.2;margin:0}
.phead p{margin:0;color:var(--muted)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:600;background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:hsl(var(--h) 45% 50%)}
.list{display:flex;flex-wrap:wrap;gap:8px}
.cbtn{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 14px;border-radius:8px;cursor:pointer}
.cbtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cdesc{margin:0;padding:12px 14px;background:var(--bg);border-radius:10px;min-height:3.4em}
.wars{display:grid;gap:8px}
.wcard{font:inherit;text-align:start;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.wcard:hover{border-color:var(--accent)}
.wcard b{font-weight:600}
.wcard small{grid-column:1;color:var(--muted)}
.pill{grid-row:1/span 2;grid-column:2;font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 10px;border:1.5px solid currentColor;white-space:nowrap}
.r-win{color:var(--win)}.r-loss{color:var(--loss)}.r-mixed{color:var(--mix)}.r-internal{color:var(--int)}.r-absent{color:var(--abs)}
.back{align-self:flex-start}
.btn{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:5px 14px;border-radius:8px;cursor:pointer;min-height:36px}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wtitle{font-family:var(--font-d);font-size:21px;margin:0;line-height:1.3}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:13.5px}
.verdict{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:600}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps li{counter-increment:s;padding:10px 14px;border-radius:10px;background:var(--bg);border:1px solid transparent;animation:rise .4s both;display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;display:grid;place-items:center}
.steps li.cur{border-color:var(--accent)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.prog{display:flex;gap:5px;margin-inline-start:auto}
.prog span{width:22px;height:5px;border-radius:3px;background:var(--line)}
.prog span.on{background:var(--accent)}
.ref{color:var(--muted);font-size:13px}
.empty{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>

      <p class="note">رسم تخطيطي غير مقيس. أماكن المدن والحدود تقريبية، والشمال في الأعلى.</p>
    </section>
    <section class="panel" id="panel" aria-live="polite"></section>
  </div>
</div>

var RES={win:"انتصار",loss:"هزيمة",mixed:"نتيجة مختلطة",internal:"حرب أهلية",absent:"لم يشارك"};

var $=function(s){return document.querySelector(s)};
var svg=$("#map"),panel=$("#panel"),chipsEl=$("#chips");

function byId(id){for(var i=0;i<T.length;i++)if(T[i].id===id)return T[i]}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}

/* static map */
var base='<rect width="640" height="880" fill="var(--sea)"/>'+

 '<ellipse class="lake" cx="333" cy="218" rx="13" ry="22"/>'+
 '<ellipse class="lake" cx="336" cy="648" rx="17" ry="50"/>'+
 '<text class="sea-l" x="336" y="728" style="font-size:12px">البحر الميت</text>';
var tr="";
T.forEach(function(t){
  if(t.noPoly)return;
  tr+='<polygon class="tribe" style="--h:'+t.h+'" data-id="'+t.id+'" points="'+t.poly+'" tabindex="0" role="button" aria-label="'+t.name+'"/>';
});
T.forEach(function(t){
  if(t.noPoly)return;
  tr+='<text class="tl" x="'+t.lx+'" y="'+t.ly+'">'+t.name+'</text>';
});
svg.innerHTML=base+'<g id="tr">'+tr+'</g><g id="cl"></g><g id="wr"></g>';
var trG=svg.querySelector("#tr"),clG=svg.querySelector("#cl"),wrG=svg.querySelector("#wr");
trG.addEventListener("click",function(e){var p=e.target.closest(".tribe");if(p)pick(p.getAttribute("data-id"))});
trG.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){var p=e.target.closest(".tribe");if(p){e.preventDefault();pick(p.getAttribute("data-id"))}}});
chipsEl.innerHTML=T.map(function(t){return '<button class="chip" type="button" style="--h:'+t.h+'" data-id="'+t.id+'" aria-pressed="false"><i></i>'+t.name+'</button>'}).join("");
chipsEl.addEventListener("click",function(e){var b=e.target.closest(".chip");if(b)pick(b.getAttribute("data-id"))});

function pick(id){stop();S.id=id;S.tab="cities";S.city=null;S.war=null;S.step=0;render()}
function stop(){if(S.timer){clearInterval(S.timer);S.timer=null}}

function render(){
  var t=byId(S.id);
  svg.classList.add("has-sel");
  Array.prototype.forEach.call(trG.querySelectorAll(".tribe"),function(p){p.classList.toggle("sel",p.getAttribute("data-id")===S.id)});
  Array.prototype.forEach.call(chipsEl.children,function(b){b.setAttribute("aria-pressed",b.getAttribute("data-id")===S.id)});
  svg.classList.toggle("has-sel",!t.noPoly);
  drawCities(t);
  drawPanel(t);
  if(S.war!==null)drawStage(t,t.wars[S.war],S.step,true);else wrG.innerHTML="";
}

function drawCities(t){
  var h="";
  t.cities.forEach(function(c,i){
    h+='<g class="city'+(S.city===i?" on":"")+'" data-i="'+i+'" style="--d:'+(i*70)+'ms" transform="translate('+c.x+' '+c.y+')" tabindex="0" role="button" aria-label="'+c.n+'"><circle r="6"/><text y="-11">'+c.n+'</text></g>';
  });
  clG.innerHTML=h;
  clG.style.display=(S.tab==="cities"||S.war===null)?"":"none";
}
clG.addEventListener("click",function(e){var g=e.target.closest(".city");if(!g)return;S.tab="cities";S.war=null;stop();S.city=+g.getAttribute("data-i");render()});

function drawPanel(t){
  var h='<div class="phead" style="--h:'+t.h+'"><h2>'+(t.noPoly?"سبط ":"")+t.name+'</h2><p>'+esc(t.mean)+'</p></div>';
  h+='<div class="tabs" role="tablist"><button class="tab" role="tab" data-tab="cities" aria-selected="'+(S.tab==="cities")+'" style="--h:'+t.h+'">المدن ('+t.cities.length+')</button><button class="tab" role="tab" data-tab="wars" aria-selected="'+(S.tab==="wars")+'" style="--h:'+t.h+'">الحروب ('+t.wars.length+')</button></div>';
  if(S.tab==="cities"){
    h+='<div class="list">'+t.cities.map(function(c,i){return '<button class="cbtn" type="button" data-i="'+i+'" aria-pressed="'+(S.city===i)+'">'+c.n+'</button>'}).join("")+'</div>';
    var c=S.city!==null?t.cities[S.city]:null;
    h+='<p class="cdesc">'+(c?'<b>'+c.n+':</b> '+esc(c.d):'<span class="empty">اضغط على اسم مدينة هنا أو على نقطتها في الخريطة لتعرف لماذا اشتهرت.</span>')+'</p>';
    if(t.noPoly)h+='<p class="note">لاوي بلا نصيب. له 48 مدينة موزعة على الأسباط، وهذه مدن الملجأ الست.</p>';
  }else if(S.war===null){
    h+='<div class="wars">'+t.wars.map(function(w,i){return '<button class="wcard" type="button" data-w="'+i+'"><b>'+esc(w.t)+'</b><small>ضد: '+esc(w.enemy)+' · '+esc(w.yr)+'</small><span class="pill r-'+w.res+'">'+RES[w.res]+'</span></button>'}).join("")+'</div><p class="note">اضغط على حرب لتشاهدها على الخريطة.</p>';
  }else{
    var w=t.wars[S.war],n=w.steps.length;
    h+='<button class="btn back" type="button" data-act="list">رجوع إلى كل الحروب</button>';
    h+='<h3 class="wtitle">'+esc(w.t)+'</h3><div class="meta"><span>الخصم: '+esc(w.enemy)+'</span><span>الزمن: '+esc(w.yr)+'</span><span class="ref">'+esc(w.ref)+'</span></div>';
    h+='<ol class="steps">';
    for(var i=0;i<=S.step;i++)h+='<li class="'+(i===S.step?"cur":"")+'">'+esc(w.steps[i])+'</li>';
    h+='</ol>';
    if(S.step===n-1)h+='<div class="verdict"><span class="pill r-'+w.res+'">'+RES[w.res]+'</span><span>المنتصر: '+esc(w.win)+'</span></div>';
    h+='<div class="ctrl"><button class="btn" type="button" data-act="prev"'+(S.step===0?" disabled":"")+'>السابق</button><button class="btn pri" type="button" data-act="next"'+(S.step===n-1?" disabled":"")+'>التالي</button><button class="btn" type="button" data-act="replay">إعادة</button><button class="btn" type="button" data-act="toggle">'+(S.timer?"إيقاف التشغيل":"تشغيل تلقائي")+'</button><span class="prog" aria-hidden="true">'+w.steps.map(function(_,i){return '<span class="'+(i<=S.step?"on":"")+'"></span>'}).join("")+'</span></div>';
  }
  panel.innerHTML=h;
}

panel.addEventListener("click",function(e){
  var t=byId(S.id),b;
  if((b=e.target.closest(".tab"))){stop();S.tab=b.getAttribute("data-tab");S.war=null;S.step=0;render();return}
  if((b=e.target.closest(".cbtn"))){S.city=+b.getAttribute("data-i");render();return}
  if((b=e.target.closest(".wcard"))){S.war=+b.getAttribute("data-w");S.step=0;render();start();return}
  if((b=e.target.closest("[data-act]"))){
    var a=b.getAttribute("data-act"),n=S.war!==null?t.wars[S.war].steps.length:0;
    if(a==="list"){stop();S.war=null;S.step=0;render()}
    else if(a==="next"){stop();go(Math.min(n-1,S.step+1))}
    else if(a==="prev"){stop();go(Math.max(0,S.step-1))}
    else if(a==="replay"){stop();S.step=0;render();start()}
    else if(a==="toggle"){if(S.timer){stop();drawPanel(t)}else{if(S.step>=n-1)S.step=0;render();start()}}
  }
});
function go(s){var t=byId(S.id);S.step=s;drawPanel(t);drawStage(t,t.wars[S.war],s,false)}
function start(){
  stop();var t=byId(S.id);
  S.timer=setInterval(function(){
    var n=t.wars[S.war].steps.length;
    if(S.step>=n-1){stop();drawPanel(t);return}
    go(S.step+1);
  },3400);
  drawPanel(t);
}

function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function drawStage(t,w,step,full){
  wrG.innerHTML="";
  clG.style.display="none";
  var n=w.steps.length,last=step===n-1;
  var ours={x:t.cx,y:t.cy},en={x:w.ex,y:w.ey};
  // enemy node
  var g=el("g",{"class":"node enemy"+(step===0&&!full?" in":"")},wrG);
  el("circle",{"class":"base",cx:en.x,cy:en.y,r:12},g);
  var tx=el("text",{x:en.x,y:en.y-18},g);tx.textContent=w.enemy;
  // our node
  var g2=el("g",{"class":"node"+(step===0&&!full?" in":"")},wrG);
  var c2=el("circle",{"class":"base",cx:ours.x,cy:ours.y,r:12},g2);
  c2.style.fill="hsl("+t.h+" 55% 50%)";
  var tx2=el("text",{x:ours.x,y:ours.y+30},g2);tx2.textContent=t.name;
  // arrow
  if(step>=1&&w.dir!=="none"){
    var a=w.dir==="in"?en:ours,b=w.dir==="in"?ours:en;
    var dx=b.x-a.x,dy=b.y-a.y,L=Math.sqrt(dx*dx+dy*dy)||1,ux=dx/L,uy=dy/L;
    var x1=a.x+ux*15,y1=a.y+uy*15,x2=b.x-ux*22,y2=b.y-uy*22;
    var isNew=(step===1&&!full);
    el("line",{"class":"arrow"+(isNew?" new":""),x1:x1,y1:y1,x2:x2,y2:y2,pathLength:1},wrG);
    var px=-uy,py=ux,hx=x2+ux*10,hy=y2+uy*10;
    el("polygon",{"class":"head"+(isNew?" new":""),points:(x2+px*8)+","+(y2+py*8)+" "+(x2-px*8)+","+(y2-py*8)+" "+hx+","+hy},wrG);
    if(isNew){
      for(var k=0;k<3;k++){
        var u=el("circle",{"class":"unit",r:4},wrG);
        var am=el("animateMotion",{dur:"1.1s",begin:(k*0.25)+"s",repeatCount:"2",path:"M"+x1+" "+y1+" L"+x2+" "+y2},u);
      }
    }
  }
  // clash
  if(step>=2&&w.dir!=="none"){
    var cg=el("g",{"class":"clash"+(step===2&&!full?" new":"")},wrG);
    el("circle",{"class":"burst",cx:en.x,cy:en.y,r:18},cg);
    el("line",{x1:en.x-9,y1:en.y-9,x2:en.x+9,y2:en.y+9},cg);
    el("line",{x1:en.x-9,y1:en.y+9,x2:en.x+9,y2:en.y-9},cg);
  }
  // result marks
  if(last){
    var isNew2=!full;
    function mark(p,kind){
      var c=kind==="win"?"var(--win)":kind==="loss"?"var(--loss)":kind==="internal"?"var(--int)":kind==="absent"?"var(--abs)":"var(--mix)";
      var rg=el("g",{"class":"res"+(isNew2?" new":"")},wrG);
      var r=el("circle",{"class":"ring",cx:p.x,cy:p.y,r:19},rg);r.style.stroke=c;
      var bg=el("circle",{cx:p.x+16,cy:p.y-16,r:10},rg);bg.style.fill=c;
      var d=kind==="win"?"M-4 0 L-1 3 L4 -3":kind==="loss"?"M-3 -3 L3 3 M3 -3 L-3 3":kind==="absent"?"M-4 0 L4 0":"M-4 1 Q-2 -3 0 0 T4 -1";
      var pth=el("path",{d:d,transform:"translate("+(p.x+16)+" "+(p.y-16)+")",fill:"none","stroke-width":2.4,"stroke-linecap":"round","stroke-linejoin":"round"},rg);
      pth.style.stroke="var(--surface)";
    }
    if(w.res==="win"){mark(ours,"win");mark(en,"loss")}
    else if(w.res==="loss"){mark(ours,"loss");mark(en,"win")}
    else{mark(ours,w.res);mark(en,w.res==="absent"?"absent":w.res)}
  }
}
render();
start_demo();
function start_demo(){}
})();
</script>
